<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Adaptado a teléfonos: viewport + safe-area -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Academy</title>
<style>
/* ===== COLORES (tokens). Cambia aquí para modificar la paleta del sitio ===== */
:root{--bg:#fff;--fg:#1d2733;--card:#f3f6fa;--pri:#1f4e8c;--onpri:#fff;--mut:#667385;--bd:#d9e0e8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e8edf2;--card:#19222c;--pri:#6aa4e8;--onpri:#0b1118;--mut:#9aa7b5;--bd:#2a3644;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e8edf2;--card:#19222c;--pri:#6aa4e8;--onpri:#0b1118;--mut:#9aa7b5;--bd:#2a3644;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
a{color:var(--pri)}
/* ===== ENCABEZADO: logo JA + menú ===== */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-weight:700}
.ja{background:var(--pri);color:var(--onpri);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-weight:800;letter-spacing:1px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--fg)}
nav a.on{background:var(--card);font-weight:600}
main{max-width:960px;margin:0 auto;padding:16px}
h1,h2{line-height:1.2}
/* ===== PORTADA (carrusel de imágenes) ===== */
.hero{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--pri),#2c7a7b);min-height:200px;color:#fff}
.hero img{width:100%;height:clamp(200px,45vw,380px);object-fit:cover;display:block}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.hero .cap a{color:#fff;font-weight:600}
.hero .empty{padding:48px 20px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--pri)}
/* ===== TARJETAS Y REJILLAS ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;text-decoration:none;color:var(--fg);display:block}
.card b{display:block;font-size:1.1rem;margin-bottom:4px}
.card small,small{color:var(--mut)}
figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
figcaption{padding:10px 12px}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--card);flex-wrap:wrap}
.essay img{max-width:100%;border-radius:10px}
/* ===== FORMULARIOS DEL PANEL (#addform) ===== */
input,textarea,button,select{font:inherit;color:inherit}
input[type=text],input[type=password],textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:4px 0}
button{padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
button.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
button.del{color:#c0392b}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--pri);color:var(--onpri)}
.sub{margin-left:18px}
.note{background:var(--card);border-left:4px solid var(--pri);padding:10px 12px;border-radius:6px;margin:10px 0}
/* ===== BUSCADOR FALSO "LookingTec" ===== */
.lt{max-width:560px;margin:0 auto;padding:12vh 16px 24px;text-align:center}
.ltl{font-size:clamp(2.4rem,12vw,4rem);margin:0 0 20px;font-weight:600}
.lt input[type=text]{border-radius:24px;padding:12px 18px}
.res{text-align:left;margin-top:18px}
.res div{margin-bottom:16px}
.res a{font-size:1.05rem;color:var(--pri)}
.res small{display:block}
/* ===== PIE: credenciales ===== */
footer{border-top:1px solid var(--bd);padding:20px 16px;text-align:center;color:var(--mut);font-size:.92rem}
</style>
</head>
<body>
<div id="root"></div>

<!-- ===== DATOS GUARDADOS (aquí queda todo lo que subes; no se borra salvo que tú lo elimines) ===== -->
<script id="state" type="application/json">{"hero":[],"papers":[],"essays":[],"album":[]}</script>

<script>
/* ===== UTILIDADES ===== */
const S = JSON.parse(document.getElementById('state').textContent); // estado guardado
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
let editId = null;                    // id del ensayo que se está editando (null = ensayo nuevo)
let tab = 'hero', slide = 0;          // pestaña del panel y diapositiva activa
let draft = {title:'', img:null, points:[{t:'', body:'', subs:['']}], concl:'', refs:''}; // ensayo en edición

/* ===== CONEXIÓN CON SUPABASE (servidor): lo que subes se guarda en línea y lo ve todo el mundo ===== */
const SB = 'https://rdjgervvwhwzuaftvwmv.supabase.co';           // dirección de tu proyecto
const KEY = 'sb_publishable_98qle0pRrPke9TYaUIRV7Q_9YfiN9mu';     // clave pública (publishable): es normal que esté aquí
let tok = null, loadErr = '';                                      // tok = sesión del dueño (solo tras entrar con correo y contraseña)

/* Llamada genérica al servidor (datos y archivos) */
async function api(m, p, b, x) {
  const h = Object.assign({apikey: KEY}, x || {});
  if (tok) h.Authorization = 'Bearer ' + tok;
  const isBlob = b instanceof Blob;
  if (b != null && !isBlob) h['Content-Type'] = 'application/json';
  const r = await fetch(SB + p, {method: m, headers: h, body: b == null ? undefined : (isBlob ? b : JSON.stringify(b))});
  if ((r.status === 401 || r.status === 403) && tok) { tok = null; try { sessionStorage.removeItem('ja_tok'); } catch (e) {} go(); }
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()));
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
/* Carga todo el contenido guardado en el servidor */
async function load() {
  const rows = await api('GET', '/rest/v1/items?select=id,kind,data,created_at&order=created_at.asc');
  for (const k of ['hero', 'papers', 'essays', 'album']) S[k] = [];
  rows.forEach(x => S[x.kind] && S[x.kind].push(Object.assign({id: x.id}, x.data)));
}
/* Guarda (crea o actualiza) un elemento */
async function put(kind, it) { const {id, ...data} = it; await api('POST', '/rest/v1/items', {id, kind, data}, {Prefer: 'resolution=merge-duplicates,return=minimal'}); }
/* Sube un archivo al almacén en línea */
async function up(f) {
  const e = ((f.name || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'bin';
  const path = uid() + uid() + '.' + e;
  await api('POST', '/storage/v1/object/media/' + path, f, {'Content-Type': f.type || 'application/octet-stream'});
  return {id: path, url: SB + '/storage/v1/object/public/media/' + path};
}
/* Elimina un elemento (y su archivo) solo cuando tú lo pides */
async function del(k, id) {
  if (!confirm('¿Eliminar definitivamente?')) return;
  const it = S[k].find(x => x.id === id);
  try {
    await api('DELETE', '/rest/v1/items?id=eq.' + encodeURIComponent(id));
    if (it && it.aid) { try { await api('DELETE', '/storage/v1/object/media/' + it.aid); } catch (e) {} }
    S[k] = S[k].filter(x => x.id !== id);
  } catch (e) { alert('No se pudo eliminar: ' + e.message); }
  go();
}
/* Entrar como dueño con correo y contraseña */
async function login() {
  try {
    const r = await fetch(SB + '/auth/v1/token?grant_type=password', {method: 'POST', headers: {apikey: KEY, 'Content-Type': 'application/json'}, body: JSON.stringify({email: $('#le').value.trim(), password: $('#lp').value})});
    const j = await r.json();
    if (!r.ok) return alert('No se pudo entrar: ' + (j.msg || j.error_description || j.message || r.status));
    tok = j.access_token; try { sessionStorage.setItem('ja_tok', tok); } catch (e) {}
    go();
  } catch (e) { alert('Error de conexión: ' + e.message); }
}
function logout() { tok = null; unlocked = false; try { sessionStorage.removeItem('ja_tok'); } catch (e) {} location.hash = 'buscar'; go(); }
/* Pantalla de acceso (correo y contraseña) */
function loginView() {
  return shell(`<h1>Acceso</h1><input type="text" id="le" placeholder="Correo" autocomplete="username" autocapitalize="off">
    <input type="password" id="lp" placeholder="Contraseña" autocomplete="current-password">
    <p><button class="pri" onclick="login()">Entrar</button></p>`, '');
}
/* Al abrir la página: recupera la sesión (si había) y carga el contenido */
(async () => {
  try { tok = sessionStorage.getItem('ja_tok'); } catch (e) {}
  try { await load(); } catch (e) { tok = null; try { await load(); } catch (e2) { loadErr = 'No se pudo cargar el contenido. Revisa tu conexión.'; } }
  go();
})();

/* ===== ACCESO AL PANEL SIN ESCRIBIR #addform: toca el logo JA 10 veces seguidas y se abre el buscador falso ===== */
let taps = 0, tapT;
function logoTap(e) { taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1500); if (taps >= 10) { taps = 0; e.preventDefault(); location.hash = 'buscar'; } }

/* ===== ESTRUCTURA COMÚN: encabezado y pie ===== */
function shell(inner, r) {
  const n = (h, t) => `<a href="#${h}" class="${r === h ? 'on' : ''}">${t}</a>`;
  return `<header>
    <a class="logo" href="#" onclick="logoTap(event)"><span class="ja">JA</span><span>Just Academy</span></a>
    <nav>${n('', 'Inicio')}${n('papers', 'Papers')}${n('ensayos', 'Ensayos')}${n('album', 'Álbum')}</nav>
  </header><main>${inner}</main>
  <footer>
    <b>Just Academy</b><br>
    A nombre de Michael Toribio, estudiante de la facultad de ingeniería civil.<br>
    Realiza una documentación de su proceso académico, tanto suyo como de otros estudiantes.
  </footer>`;
}

/* ===== PÁGINA PRINCIPAL: carrusel + enlaces ===== */
function home() {
  let h;
  if (!S.hero.length) h = `<div class="hero"><div class="empty"><h1>Just Academy</h1><p>Documentación del proceso académico en ingeniería civil.</p></div></div>`;
  else {
    const s = S.hero[slide % S.hero.length];
    h = `<div class="hero"><img src="${esc(s.url)}" alt="${esc(s.title)}">${s.title ? `<div class="cap">${s.link ? `<a href="${esc(s.link)}">${esc(s.title)}</a>` : esc(s.title)}</div>` : ''}</div>
    <div class="dots">${S.hero.map((_, i) => `<i class="${i === slide % S.hero.length ? 'on' : ''}"></i>`).join('')}</div>`;
  }
  return h + `<h2>Explora</h2><div class="grid">
    <a class="card" href="#papers"><b>📄 Papers</b><small>Investigaciones y tareas en documentos (${S.papers.length})</small></a>
    <a class="card" href="#ensayos"><b>✍️ Ensayos</b><small>Temas de reflexión de estudiantes (${S.essays.length})</small></a>
    <a class="card" href="#album"><b>📷 Álbum</b><small>Experiencias universitarias (${S.album.length})</small></a></div>`;
}

/* ===== PAPERS: lista de documentos subidos ===== */
function papers(adm) {
  return `<h1>Papers</h1><p><small>Investigaciones bibliográficas y trabajos académicos.</small></p><ul class="list">` +
    (S.papers.map(p => `<li><span><a href="${esc(p.url)}" target="_blank" rel="noopener"><b>${esc(p.title)}</b></a><br><small>${esc(p.date)}</small></span>${adm ? `<button class="del" onclick="del('papers','${p.id}')">Eliminar</button>` : ''}</li>`).join('') || '<li>Aún no hay documentos.</li>') + `</ul>`;
}

/* ===== ENSAYOS: lista y vista de un ensayo ===== */
function essays(adm) {
  return `<h1>Ensayos</h1><div class="grid">` +
    (S.essays.map(x => `<div class="card"><a href="#ensayo=${x.id}" style="text-decoration:none;color:inherit"><b>${esc(x.title)}</b><small>${esc(x.date)}</small></a>${adm ? `<br><button onclick="editEssay('${x.id}')">Editar</button> <button class="del" onclick="del('essays','${x.id}')">Eliminar</button>` : ''}</div>`).join('') || '<p>Aún no hay ensayos.</p>') + `</div>`;
}
function essay(id) {
  const x = S.essays.find(e => e.id === id);
  if (!x) return '<p>Ensayo no encontrado.</p>';
  return `<article class="essay"><p><a href="#ensayos">← Ensayos</a></p><h1>${esc(x.title)}</h1>${x.img ? `<img src="${esc(x.img)}" alt="">` : ''}` +
    x.points.map((p, i) => `<h2>${i + 1}. ${esc(p.t)}</h2>${p.body ? `<p>${esc(p.body).replace(/\n/g, '<br>')}</p>` : ''}<ul>${p.subs.filter(s => s).map(s => `<li>${esc(s)}</li>`).join('')}</ul>`).join('') +
    (x.concl ? `<h2>Conclusión</h2><p>${esc(x.concl).replace(/\n/g, '<br>')}</p>` : '') +
    (x.refs ? `<h2>Referencias</h2><p>${esc(x.refs).replace(/\n/g, '<br>')}</p>` : '') + `</article>`;
}

/* ===== ÁLBUM: fotos con descripción debajo ===== */
function album(adm) {
  return `<h1>Álbum universitario</h1><div class="grid">` +
    (S.album.map(a => `<figure><img src="${esc(a.url)}" alt=""><figcaption>${esc(a.desc)}${adm ? `<br><button class="del" onclick="del('album','${a.id}')">Eliminar</button>` : ''}</figcaption></figure>`).join('') || '<p>Aún no hay fotos.</p>') + `</div>`;
}

/* ===== PANEL OCULTO: se abre con #addform al final de la dirección ===== */
function admin() {
  const T = (k, t) => `<button class="${tab === k ? 'on' : ''}" onclick="tab='${k}';go()">${t}</button>`;
  let b = '';
  if (tab === 'hero') b = `<h2>Imágenes de la portada</h2>
    <input type="file" id="hf" accept="image/*"><input type="text" id="ht" placeholder="Título (opcional)"><input type="text" id="hl" placeholder="Enlace, ej. #papers (opcional)">
    <p><button class="pri" onclick="addHero()">Agregar imagen</button></p>
    <ul class="list">${S.hero.map(h => `<li><span>${esc(h.title || 'Sin título')}</span><button class="del" onclick="del('hero','${h.id}')">Eliminar</button></li>`).join('')}</ul>`;
  if (tab === 'papers') b = `<h2>Subir documento (Word, PDF…)</h2>
    <input type="file" id="pf"><input type="text" id="pt" placeholder="Título del documento">
    <p><button class="pri" onclick="addPaper()">Subir</button></p>` + papers(true);
  if (tab === 'essays') b = `<h2>${editId ? 'Editar ensayo' : 'Nuevo ensayo'}</h2>
    <input type="text" placeholder="Título" value="${esc(draft.title)}" oninput="draft.title=this.value">
    <p>Imagen: <input type="file" accept="image/*" onchange="essayImg(this)"> ${draft.img ? '✔' : ''}</p>` +
    draft.points.map((p, i) => `<div><input type="text" placeholder="Punto ${i + 1}" value="${esc(p.t)}" oninput="draft.points[${i}].t=this.value"><textarea rows="3" placeholder="Contenido del punto ${i + 1}" oninput="draft.points[${i}].body=this.value">${esc(p.body || '')}</textarea>` +
      p.subs.map((s, j) => `<div class="sub"><input type="text" placeholder="- Sub punto" value="${esc(s)}" oninput="draft.points[${i}].subs[${j}]=this.value"></div>`).join('') +
      `<p class="sub"><button onclick="draft.points[${i}].subs.push('');go()">+ Agregar sub punto</button></p></div>`).join('') +
    `<p><button onclick="draft.points.push({t:'',body:'',subs:['']});go()">+ Agregar punto</button></p>
    <textarea rows="4" placeholder="Conclusión" oninput="draft.concl=this.value">${esc(draft.concl)}</textarea>
    <textarea rows="4" placeholder="Referencias" oninput="draft.refs=this.value">${esc(draft.refs)}</textarea>
    <p><button class="pri" onclick="addEssay()">${editId ? 'Guardar cambios' : 'Publicar ensayo'}</button> ${editId ? '<button onclick="cancelEdit()">Cancelar</button>' : ''}</p>` + essays(true);
  if (tab === 'album') b = `<h2>Nueva foto del álbum</h2>
    <input type="file" id="af" accept="image/*"><textarea id="ad" rows="2" placeholder="Descripción debajo de la foto"></textarea>
    <p><button class="pri" onclick="addAlbum()">Agregar foto</button></p>` + album(true);
  return `<h1>Panel de edición</h1>` +
    '<div class="note">Conectado como dueño. <button onclick="logout()">Salir</button> <button onclick="migrate()">Importar lo guardado en este navegador (versión anterior)</button></div>' +
    `<div class="tabs">${T('hero', 'Portada')}${T('papers', 'Papers')}${T('essays', 'Ensayos')}${T('album', 'Álbum')}</div>${b}`;
}

/* ===== ACCIONES DEL PANEL (cada una sube el archivo, guarda el dato en línea y actualiza la página) ===== */
const today = () => new Date().toLocaleDateString('es');
/* Ejecuta una acción mostrando un aviso mientras guarda */
async function run(fn) {
  $('#root').insertAdjacentHTML('afterbegin', '<div class="note">Guardando… espera un momento.</div>');
  try { await fn(); } catch (e) { alert('No se pudo guardar: ' + e.message); }
  go();
}
async function addHero() { const f = $('#hf').files[0]; if (!f) return alert('Elige una imagen'); const t = $('#ht').value, l = $('#hl').value; await run(async () => { const a = await up(f); const it = {id: uid(), aid: a.id, url: a.url, title: t, link: l}; await put('hero', it); S.hero.push(it); }); }
async function addPaper() { const f = $('#pf').files[0]; if (!f) return alert('Elige un archivo'); const t = $('#pt').value || f.name; await run(async () => { const a = await up(f); const it = {id: uid(), aid: a.id, url: a.url, title: t, date: today()}; await put('papers', it); S.papers.push(it); }); }
async function addAlbum() { const f = $('#af').files[0]; if (!f) return alert('Elige una foto'); const d = $('#ad').value; await run(async () => { const a = await up(f); const it = {id: uid(), aid: a.id, url: a.url, desc: d}; await put('album', it); S.album.push(it); }); }
async function essayImg(i) { try { const a = await up(i.files[0]); draft.img = a.url; draft.aid = a.id; go(); } catch (e) { alert(e.message); } }
/* Carga un ensayo existente en el formulario para editarlo */
function editEssay(id) {
  const x = S.essays.find(e => e.id === id); if (!x) return;
  draft = {title: x.title, img: x.img, aid: x.aid, points: x.points.map(p => ({t: p.t, body: p.body || '', subs: p.subs.length ? p.subs.slice() : ['']})), concl: x.concl || '', refs: x.refs || ''};
  editId = id; tab = 'essays'; go(); window.scrollTo(0, 0);
}
/* Cancela la edición y limpia el formulario */
function cancelEdit() { editId = null; draft = {title:'', img:null, points:[{t:'', body:'', subs:['']}], concl:'', refs:''}; go(); }
/* Publica un ensayo nuevo o guarda los cambios del que se edita */
async function addEssay() {
  if (!draft.title) return alert('Falta el título');
  await run(async () => {
    const data = {aid: draft.aid, title: draft.title, img: draft.img, points: draft.points, concl: draft.concl, refs: draft.refs};
    if (editId) {
      const x = S.essays.find(e => e.id === editId), old = x.aid;
      Object.assign(x, data); await put('essays', x);
      if (old && old !== draft.aid) { try { await api('DELETE', '/storage/v1/object/media/' + old); } catch (e) {} } // borra la imagen anterior si la cambiaste
    } else { const it = Object.assign({id: uid(), date: today()}, data); await put('essays', it); S.essays.push(it); }
    editId = null; draft = {title:'', img:null, points:[{t:'', body:'', subs:['']}], concl:'', refs:''};
  });
}
/* Importa lo que se guardó en ESTE navegador con la versión anterior del sitio (solo una vez) */
async function migrate() {
  await run(async () => {
    const d = await new Promise((ok, no) => { const q = indexedDB.open('just-academy', 1); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); });
    const get = k => new Promise(ok => { try { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); } catch (e) { ok(null); } });
    const old = await get('state');
    if (!old) { alert('No hay contenido de la versión anterior en este navegador.'); return; }
    let n = 0;
    for (const k of ['hero', 'papers', 'album', 'essays']) for (const it of (old[k] || [])) {
      if (S[k].some(x => x.id === it.id)) continue;
      if (it.aid) {
        const f = await get(it.aid);
        if (f) { const a = await up(f); it.aid = a.id; if (k === 'essays') it.img = a.url; else it.url = a.url; }
        else if (k !== 'essays') continue; else { it.aid = null; it.img = null; }
      }
      await put(k, it); S[k].push(it); n++;
    }
    alert('Importados: ' + n + ' elementos.');
  });
}

/* ===== BUSCADOR FALSO: cualquier palabra muestra resultados; solo el código secreto abre el panel ===== */
let unlocked = false; // se activa solo al escribir el código en el buscador
function search() {
  const c = ['#2a5bd7', '#d93025', '#f4b400', '#2a5bd7', '#0f9d58', '#d93025'];
  const t = 'Looking'.split('').map((l, i) => `<span style="color:${c[i % 6]}">${l}</span>`).join('') + '<span style="color:#d93025">Tec</span>';
  return `<div class="lt"><h1 class="ltl">${t}</h1>
    <input type="text" id="q" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')doSearch()">
    <p><button onclick="doSearch()">Buscar en LookingTec</button></p><div class="res" id="res"></div></div>`;
}
/* ===== CÓDIGO OCULTO: el código secreto no está escrito aquí, solo su huella SHA-256.
   Para cambiarlo, hay que reemplazar CODE_HASH por la huella del código nuevo. ===== */
const CODE_HASH = 'ef618347515b044135998894645f974a069dfc190feda275195a522926c40e28';
function sha256(s) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a)), K = [], H = [];
  for (let c = 2, n = 0; n < 64; c++) { let pr = 1; for (let d = 2; d * d <= c; d++) if (c % d == 0) { pr = 0; break; } if (pr) { if (n < 8) H[n] = (Math.sqrt(c) % 1 * 4294967296) | 0; K[n++] = (Math.cbrt(c) % 1 * 4294967296) | 0; } }
  const b = unescape(encodeURIComponent(s)), l = b.length, N = (((l + 8) >> 6) + 1) * 16, w = new Array(N).fill(0);
  for (let i = 0; i < l; i++) w[i >> 2] |= b.charCodeAt(i) << (24 - (i % 4) * 8);
  w[l >> 2] |= 0x80 << (24 - (l % 4) * 8); w[N - 1] = l * 8;
  let h = H.slice();
  for (let j = 0; j < N; j += 16) {
    const x = w.slice(j, j + 16);
    for (let i = 16; i < 64; i++) { const a = x[i - 15], c = x[i - 2]; x[i] = (x[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + x[i - 7] + (rr(c, 17) ^ rr(c, 19) ^ (c >>> 10))) | 0; }
    let [a, b2, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + x[i]) | 0, t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b2) ^ (a & c) ^ (b2 & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b2; b2 = a; a = (t1 + t2) | 0;
    }
    h = [h[0] + a | 0, h[1] + b2 | 0, h[2] + c | 0, h[3] + d | 0, h[4] + e | 0, h[5] + f | 0, h[6] + g | 0, h[7] + hh | 0];
  }
  return h.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}
function doSearch() {
  const q = $('#q').value.trim();
  if (sha256(q) === CODE_HASH) { unlocked = true; location.hash = 'addform'; return; } // compara con la huella, no con el código
  if (!q) return;
  const w = esc(q);
  const r = [[`${w} – Qué es y para qué sirve`, 'Definición, ejemplos y usos más comunes de ' + w + '.'], [`Guía completa de ${w}`, 'Todo lo que necesitas saber, paso a paso.'], [`${w}: noticias y novedades`, 'Las últimas noticias relacionadas con ' + w + '.'], [`Imágenes de ${w}`, 'Miles de imágenes y fotos de ' + w + '.'], [`${w} en foros y comunidades`, 'Opiniones y preguntas de usuarios sobre ' + w + '.'], [`Tutoriales sobre ${w}`, 'Aprende ' + w + ' con videos y ejercicios.']];
  $('#res').innerHTML = r.map(x => `<div><a href="javascript:void(0)">${x[0]}</a><small>www.ejemplo.com › ${w.replace(/\s+/g, '-').toLowerCase()}</small><small>${x[1]}</small></div>`).join('');
}

/* ===== ENRUTADOR: decide qué mostrar según la dirección (#) ===== */
function go() {
  const h = location.hash.slice(1);
  // El panel solo abre si se desbloqueó desde el buscador; si no, manda al buscador
  if (h === 'buscar' || (h === 'addform' && !unlocked)) {
    if (h !== 'buscar') { location.hash = 'buscar'; return; }
    $('#root').innerHTML = search(); return;
  }
  const adm = h === 'addform';
  let v, r = h;
  if (adm) v = tok ? admin() : loginView();
  else if (h === 'papers') v = papers(false);
  else if (h === 'ensayos') v = essays(false);
  else if (h === 'album') v = album(false);
  else if (h.startsWith('ensayo=')) { v = essay(h.slice(7)); r = 'ensayos'; }
  else { v = home(); r = ''; }
  const st = window.scrollY;
  $('#root').innerHTML = (loadErr ? '<div class="note">' + esc(loadErr) + '</div>' : '') + shell(v, r);
  if (adm) window.scrollTo(0, st);
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); go(); });
setInterval(() => { if (!location.hash && S.hero.length > 1) { slide++; go(); } }, 5000); // rota la portada
go();
</script>
